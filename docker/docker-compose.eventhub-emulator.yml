name: tip-notification-local

services:
  emulator:
    container_name: "eventhubs-emulator"
    image: "mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest"
    pull_policy: always
    volumes:
      - "./docker/eventhub-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"   # AMQP - what the Java SDK actually connects over
      - "9092:9092"   # Kafka protocol (not used here, but exposed by the image)
      - "5300:5300"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    depends_on:
      - azurite
    networks:
      eh-emulator:
        aliases:
          - "eventhubs-emulator"

  # Required by the Event Hubs emulator itself (its internal metadata store) -
  # separate from any checkpoint-store Azurite you may already run for the app.
  azurite:
    container_name: "azurite"
    image: "mcr.microsoft.com/azure-storage/azurite:latest"
    pull_policy: always
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      eh-emulator:
        aliases:
          - "azurite"

  # Not part of the emulator itself, but included so `docker compose up`
  # gives you everything needed to run the full pipeline locally in one command.
  postgres:
    container_name: "tip-notification-postgres"
    image: "postgres:15-alpine"
    environment:
      POSTGRES_DB: tip_dev
      POSTGRES_USER: tip_app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    networks:
      eh-emulator:

networks:
  eh-emulator: