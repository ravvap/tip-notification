spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tip_dev
  jpa:
    hibernate:
      ddl-auto: validate

# In dev, point at a local/mock email-api or a stub - do not use real prod credentials here.
tip:
  email-api:
    base-url: http://localhost:9999/mock-email-api
    auth-mode: api-key
    api-key: dev-local-key

logging:
  level:
    com.fdic.tip.notification: DEBUG
    org.springframework.security: DEBUG
